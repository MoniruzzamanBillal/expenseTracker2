<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif">
<div style="display:flex;align-items:center;gap:12px;min-height:58px;padding:0 14px">
<sc-if value="{{ hasCat }}" hint-placeholder-val="{{ true }}"><div style="width:36px;height:36px;flex:none;border-radius:8px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--accentText);font-size:19px"><i class="mdi mdi-{{ icon }}"></i></div></sc-if>
<sc-if value="{{ uncat }}" hint-placeholder-val="{{ false }}"><div style="width:36px;height:36px;flex:none;border-radius:8px;border:1px dashed var(--edge);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:18px"><i class="mdi mdi-shape-outline"></i></div></sc-if>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
<div style="display:flex;align-items:center;gap:5px;min-width:0"><span style="font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ title }}</span><sc-if value="{{ receipt }}" hint-placeholder-val="{{ false }}"><x-ic name="attach-outline" style="font-size:15px;color:var(--ink2);flex:none"></x-ic></sc-if></div>
<div style="display:flex;align-items:center;gap:5px;font-size:12px;line-height:16px;color:var(--ink2);white-space:nowrap;overflow:hidden"><sc-if value="{{ pending }}" hint-placeholder-val="{{ false }}"><x-ic name="cloud-upload-outline" style="font-size:13px;color:var(--warn)"></x-ic><span style="color:var(--warn)">Waiting to sync</span><span>·</span></sc-if><span style="overflow:hidden;text-overflow:ellipsis">{{ meta }}</span></div>
</div>
<sc-if value="{{ isOut }}" hint-placeholder-val="{{ true }}"><div style="flex:none;font-size:15px;font-weight:500;color:var(--neg);font-variant-numeric:tabular-nums;white-space:nowrap">−<span style="opacity:0.75;margin-right:1px">৳</span>{{ amt }}</div></sc-if>
<sc-if value="{{ isIn }}" hint-placeholder-val="{{ false }}"><div style="flex:none;font-size:15px;font-weight:500;color:var(--pos);font-variant-numeric:tabular-nums;white-space:nowrap">+<span style="opacity:0.75;margin-right:1px">৳</span>{{ amt }}</div></sc-if>
</div>
<sc-if value="{{ notLast }}" hint-placeholder-val="{{ true }}"><div style="height:1px;margin-left:62px;background:linear-gradient(90deg,var(--hair),var(--hair) calc(100% - 40px),transparent)"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:335,&quot;height&quot;:60},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lunch&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Food · 13:05&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;food&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;amt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;450&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;out&quot;,&quot;in&quot;],&quot;default&quot;:&quot;out&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;receipt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pending&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;last&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const isIn = p.kind === 'in';
    return {
      title: p.title ?? 'Transaction', meta: p.meta ?? '', icon: p.icon ?? '', amt: p.amt ?? '0',
      hasCat: !!p.icon, uncat: !p.icon, isIn, isOut: !isIn,
      receipt: !!p.receipt, pending: !!p.pending, notLast: !p.last,
    };
  }
}
</script>
</body>
</html>
