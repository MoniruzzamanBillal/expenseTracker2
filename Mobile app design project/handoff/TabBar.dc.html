<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--ground);display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif">
<div style="height:1px;background:linear-gradient(90deg,transparent,var(--hair) 48px,var(--hair) calc(100% - 48px),transparent)"></div>
<div style="display:flex;padding:0 6px;flex:1">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
<div style="flex:1;display:flex;flex-direction:column;align-items:center">
<sc-if value="{{ t.isAdd }}" hint-placeholder-val="{{ false }}"><div style="margin-top:8px;width:52px;height:38px;border-radius:10px;border:1px solid var(--accent);background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px"><x-ic name="add" style="font-size:inherit"></x-ic></div></sc-if>
<sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><div style="width:18px;height:2px;border-radius:1px;background:var(--accent)"></div><div style="margin-top:7px;font-size:21px;color:var(--accent);height:22px"><x-ic name="{{ t.iconOn }}" style="font-size:inherit"></x-ic></div><div style="font-size:10px;font-weight:500;letter-spacing:0.02em;color:var(--accent);margin-top:2px">{{ t.label }}</div></sc-if>
<sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}"><div style="height:2px"></div><div style="margin-top:7px;font-size:21px;color:var(--ink3);height:22px"><x-ic name="{{ t.icon }}" style="font-size:inherit"></x-ic></div><div style="font-size:10px;font-weight:500;letter-spacing:0.02em;color:var(--ink3);margin-top:2px">{{ t.label }}</div></sc-if>
</div>
</sc-for>
</div>
<div style="width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:0.85;margin:0 auto 8px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:84},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;activity&quot;,&quot;add&quot;,&quot;insights&quot;,&quot;budgets&quot;,&quot;none&quot;],&quot;default&quot;:&quot;today&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'today';
    const base = [
      { k: 'today', label: 'Today', icon: 'home-outline', iconOn: 'home' },
      { k: 'activity', label: 'Activity', icon: 'calendar-clear-outline', iconOn: 'calendar-clear' },
      { k: 'add', label: '', isAdd: true },
      { k: 'insights', label: 'Insights', icon: 'stats-chart-outline', iconOn: 'stats-chart' },
      { k: 'budgets', label: 'Budgets', icon: 'pie-chart-outline', iconOn: 'pie-chart' },
    ];
    return { tabs: base.map(t => ({ ...t, on: !t.isAdd && t.k === a, off: !t.isAdd && t.k !== a })) };
  }
}
</script>
</body>
</html>
