<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:8px;align-items:center;font-size:12px;color:#9397ab;font-family:Inter,system-ui,sans-serif"><span style="font:600 10px ui-monospace,Menlo,monospace;padding:3px 6px;border-radius:4px;background:#2b2741;color:#d2cefd">{{ pid }}</span>{{ label }}</div>
<div style="--ground:#161826;--card:#232532;--muted:#1f2130;--tint:#2b2741;--skel:#2c2e3c;--accent:#9184d9;--accentText:#d2cefd;--accentBorder:rgba(145,132,217,0.55);--ink:#e9e9ed;--ink2:#9397ab;--ink3:#75798c;--hair:rgba(233,233,237,0.14);--edge:#3f424d;--pos:#7cbf8e;--warn:#d8a657;--neg:#e0786e;--negTint:rgba(224,120,110,0.13);--cardShadow:0 6px 18px rgba(0,0,0,0.45);--glow:0 0 28px rgba(145,132,217,0.30);width:375px;height:812px;flex:none;position:relative;overflow:hidden;border-radius:44px;background:var(--ground);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.55;display:flex;flex-direction:column;box-shadow:0 0 0 7px #05060a,0 0 0 8px #2a2c38,0 30px 70px rgba(0,0,0,0.55)">
<dc-import name="Status" hint-size="375px,44px"></dc-import>
<div style="padding:4px 20px 0;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;gap:6px;height:44px">
<sc-if value="{{ back }}" hint-placeholder-val="{{ false }}"><div style="width:40px;height:40px;margin-left:-10px;display:flex;align-items:center;justify-content:center;font-size:22px"><x-ic name="chevron-back" style="font-size:inherit"></x-ic></div></sc-if>
<span style="font-size:20px;font-weight:500;letter-spacing:-0.015em;flex:1">{{ title }}</span>
</div>
<sc-if value="{{ hasSeg }}" hint-placeholder-val="{{ false }}"><div style="display:flex;height:36px;padding:3px;border-radius:9px;background:var(--muted);border:1px solid var(--edge)"><div style="flex:1;border-radius:6px;background:var(--card);border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500">{{ seg1 }}</div><div style="flex:1;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500">{{ seg2 }}</div></div></sc-if>
<sc-if value="{{ hasStepper }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:17px;font-weight:500;flex:1;letter-spacing:-0.015em">{{ stepper }}</span><div style="width:40px;height:40px;border-radius:10px;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:18px"><x-ic name="chevron-back" style="font-size:inherit"></x-ic></div><div style="width:40px;height:40px;border-radius:10px;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:18px;opacity:0.45"><x-ic name="chevron-forward" style="font-size:inherit"></x-ic></div></div></sc-if>
<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ true }}">
<div style="background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px"><div style="width:84px;height:10px;border-radius:3px;background:var(--skel)"></div><div style="width:180px;height:36px;border-radius:6px;background:var(--skel)"></div><div style="height:6px;border-radius:3px;background:var(--skel)"></div></div>
<div style="background:var(--card);border:1px solid var(--edge);border-radius:10px"><sc-for list="{{ sk }}" as="k" hint-placeholder-count="5"><div style="display:flex;align-items:center;gap:12px;height:58px;padding:0 14px;opacity:{{ k.o }}"><div style="width:36px;height:36px;border-radius:8px;background:var(--skel)"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px"><div style="width:{{ k.w }};height:11px;border-radius:3px;background:var(--skel)"></div><div style="width:84px;height:9px;border-radius:3px;background:var(--skel)"></div></div><div style="width:56px;height:12px;border-radius:3px;background:var(--skel)"></div></div></sc-for></div>
</sc-if>
<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}"><div style="background:var(--card);border:1px solid var(--edge);border-radius:10px;box-shadow:var(--cardShadow);padding:16px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:10px"><x-ic name="alert-circle-outline" style="font-size:22px;color:var(--neg)"></x-ic><span style="font-size:16px;font-weight:500">{{ head }}</span></div><div style="font-size:14px;color:var(--ink2)">{{ msg }}</div><div style="align-self:flex-start;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500"><x-ic name="refresh-outline" style="font-size:17px"></x-ic>Try again</div></div></sc-if>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:{{ emptyPad }} 2px 0"><div style="width:44px;height:44px;border-radius:10px;border:1px dashed var(--edge);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink3)"><x-ic name="{{ icon }}" style="font-size:inherit"></x-ic></div><div style="font-size:17px;font-weight:500;letter-spacing:-0.015em">{{ head }}</div><div style="font-size:14px;color:var(--ink2);max-width:290px">{{ sub }}</div><sc-if value="{{ hasBtn }}" hint-placeholder-val="{{ false }}"><div style="margin-top:6px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500"><x-ic name="{{ btnIcon }}" style="font-size:18px"></x-ic>{{ btn }}</div></sc-if></div></sc-if>
</div>
<sc-if value="{{ hasTab }}" hint-placeholder-val="{{ true }}"><dc-import name="TabBar" active="{{ tab }}" hint-size="375px,84px"></dc-import></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:860},&quot;pid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;X1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Loading&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Screen&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;default&quot;:&quot;loading&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;today&quot;,&quot;activity&quot;,&quot;insights&quot;,&quot;budgets&quot;,&quot;add&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const kind = p.kind ?? 'loading';
    return {
      pid: p.pid ?? 'X1', label: p.label ?? '', title: p.title ?? 'Screen', back: !!p.back,
      hasSeg: !!p.seg1, seg1: p.seg1 ?? '', seg2: p.seg2 ?? '',
      hasStepper: !!p.stepper, stepper: p.stepper ?? '',
      isLoading: kind === 'loading', isError: kind === 'error', isEmpty: kind === 'empty',
      head: p.head ?? '', sub: p.sub ?? '', msg: p.msg ?? 'Network Error', icon: p.icon ?? 'receipt-outline',
      hasBtn: !!p.btn, btn: p.btn ?? '', btnIcon: p.btnIcon ?? 'add', emptyPad: p.emptyPad ?? '40px',
      hasTab: (p.tab ?? 'none') !== 'none', tab: p.tab ?? 'none',
      sk: [{ w: '62%', o: 1 }, { w: '48%', o: 0.85 }, { w: '70%', o: 0.7 }, { w: '40%', o: 0.55 }, { w: '56%', o: 0.4 }],
    };
  }
}
</script>
</body>
</html>
